# Render Blueprint：只部署後端（HTTP + WebSocket）。前端由 GitHub Pages 提供。
# 注意：Render 不能修改既有服務的 region，這份設定只對「新建」的服務生效。
services:
  - type: web
    name: reversi
    runtime: node
    region: singapore
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOW_ORIGIN
        sync: false   # 填 GitHub Pages 的網址，例如 https://<帳號>.github.io
